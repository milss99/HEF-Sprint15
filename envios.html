{% extends 'base.html' %}

{% block conteudo %}

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fonte -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!-- CSS (TEM QUE SER POR ÚLTIMO) -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="container-pai_envios">
    <!--Bolinhas de Decoração nos cantos-->
    <div class="bolinhas bolinhas-envios1"></div>
    <div class="bolinhas bolinhas-envios2"></div>

    <!--Card branco-->
    <div class="card-envios">
        <!-- Header "Envios"-->
        <div class="header_envios d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <h3>Envios</h3>
            </div>
        </div>

        <!-- Conteúdo dentro do card -->
        <div class="row mt-4">
            <!-- Tabela -->
            <div class="col-md-8">
                <div class="table-container">
                    <table class="perfect-table" method="GET" action="{{ url_for('rend_envio') }}">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Endereço</th>
                                <th>Status de transporte</th>
                                <th>Classificação</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td>
                                    <div class="cell user">
                                        <i class="bi bi-person-fill"></i>
                                    </div>
                                </td>
                                <td><div class="cell"></div></td>
                                <td><div class="cell"></div></td>
                                <td><div class="cell"></div></td>
                            </tr>

                            <tr>
                                <td>
                                    <div class="cell user">
                                        <i class="bi bi-person-fill"></i>
                                    </div>
                                </td>
                                <td><div class="cell"></div></td>
                                <td><div class="cell"></div></td>
                                <td><div class="cell"></div></td>
                            </tr>

                            <tr>
                                <td>
                                    <div class="cell user">
                                        <i class="bi bi-person-fill"></i>
                                    </div>
                                </td>
                                <td><div class="cell"></div></td>
                                <td><div class="cell"></div></td>
                                <td><div class="cell"></div></td>
                            </tr>

                            <tr>
                                <td>
                                    <div class="cell user">
                                        <i class="bi bi-person-fill"></i>
                                    </div>
                                </td>
                                <td><div class="cell"></div></td>
                                <td><div class="cell"></div></td>
                                <td><div class="cell"></div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Lado direito -->
            <div class="col-md-4 d-flex flex-column justify-content-center gap-4">
                <div class="card-envios-mensais">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <p>Total de envios mensais:</p>
                            <h1>0</h1>
                        </div>
                        <i class="bi bi-box-seam-fill icone-card"></i>
                    </div>
                </div>

                <div class="card-envios-dia">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-truck icone-truck"></i>
                        <div>
                            <a href="{{ url_for('rend_envd') }}">
                                <div class="titulo-envio">Envios do dia</div>
                            </a>
                            <div class="numero-envio">0</div>
                        </div>
                    </div>
                    <i class="bi bi-arrow-right seta"></i>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
