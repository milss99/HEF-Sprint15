{% extends 'base.html' %}
{% block conteudo %}

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<!-- CSS próprio -->
<link rel="stylesheet" href="../static/style.css">

<div class="container-pai_perfil-usuario">

    <!-- Bolinhas de decoração -->
    <div class="bolinhas bolinhas-perfil_user1"></div>
    <div class="bolinhas bolinhas-perfil_user2"></div>

    <!-- CARD PRINCIPAL -->
    <div class="shadow-lg card-perfil_usuario ">

        <!-- TÍTULO -->
        <div class="titulo-perfil">

            <h1>Perfil do Usuário</h1>

            <p>
                Visualize suas informações pessoais.
            </p>

        </div>

        <!-- CONTEÚDO -->
        <div class="row align-items-center">

            <!-- FOTO / ÍCONE -->
            <div class="col-md-4">

                <div class="foto-area">

                    <div class="foto-perfil-usuario">
                        <i class="bi bi-person"></i>
                    </div>

                </div>

            </div>


            <!-- DADOS -->
            <div class="col-md-8 perfil-usu_dados">

                <div class="row g-3">

                    <!-- NOME -->
                    <div class="col-12">

                        <label class="form-label_perfil-usuario" for="nome">
                            Nome Completo
                        </label>

                        <div class="campo-perfil-usuario">

                            <i class="fa-regular fa-user"></i>

                            <input id="nome" type="text" value="" readonly>

                        </div>

                    </div>


                    <!-- USUÁRIO -->
                    <div class="col-12 perfil-usu_dados">

                        <label class="form-label_perfil-usuario" for="usuario">
                            Nome de Usuário
                        </label>

                        <div class="campo-perfil-usuario">

                            <i class="fa-solid fa-at"></i>

                            <input id="usuario" type="text" value="" readonly>

                        </div>

                    </div>


                    <!-- DATA -->
                    <div class="col-md-6 perfil-usu_dados">

                        <label class="form-label_perfil-usuario" for="data">
                            Data de Nascimento
                        </label>

                        <div class="campo-perfil-usuario">

                            <i class="fa-regular fa-calendar"></i>

                            <input id="data" type="text" value="" readonly>

                        </div>

                    </div>

                    <!-- GÊNERO -->
                    <div class="col-md-6 perfil-usu_dados">

                        <label class="form-label_perfil-usuario" for="genero">
                            Gênero
                        </label>

                        <div class="campo-perfil-usuario">

                            <i class="fa-solid fa-venus-mars"></i>

                            <input id="genero" type="text" value="" readonly>

                        </div>

                    </div>


                    <!-- CLASSIFICAÇÃO -->
                    <div class="col-12 perfil-usu_dados">

                        <label class="form-label_perfil-usuario" for="classificacao">
                            Classificação
                        </label>

                        <div class="campo-perfil-usuario">

                            <i class="fa-solid fa-user-shield"></i>

                            <input id="classificacao" type="text" value="" readonly>

                        </div>

                    </div>

                </div>


                <!-- BOTÃO -->
                <div class="botoes-perfil-usuario">

                    <a href="{{ url_for('nova_senha') }}" class="btn btn-primary">
                        Alterar Senha
                        <i class="fa-solid fa-lock"></i>
                    </a>

                </div>

            </div>

        </div>


    </div>

</div>

<!-- Bootstrap JS / caso algumas telas específicas precisem dele eu add em todas para evitar lemrar qual realmente PRECISA
    Mas no geral serve pra Otimizar o layout da tela
    É responsável pelos componentes que precisam de JavaScript para funcionar.
    Por exemplo: Dropdown; Modal; Collapse; Navbar responsiva; Toast; Offcanvas; Carrossel; Tooltip; Popover -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
{% endblock %}
