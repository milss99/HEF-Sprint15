{% extends 'base.html' %}
{% block conteudo %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="container-pai_producao">
    <div class="card-custom">
        <h2 class="title mb-1">Produção</h2>
        <div class="linha mb-2">
            <span></span>
            <div class="ponto"></div>
            <span></span>
        </div>

        <div class="bolinhas bolinhas-envio-producao1"></div>
        <div class="bolinhas bolinhas-envio-producao2"></div>

        <div class="mb-3">
            <label class="form-label">Produto</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" placeholder="Procure seu produto...">
                <button class="btn btn-search">Buscar</button>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-control">
                <option>Selecione o status</option>
                <option>Em produção</option>
                <option>Finalizado</option>
                <option>Pendente</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Prazo</label>
            <input type="date" class="form-control" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Localização</label>
            <input type="text" class="form-control" placeholder="Informe a localização" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Funcionário Responsável</label>
            <input type="text" class="form-control" placeholder="Informe o funcionário" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <input type="text" class="form-control" placeholder="Informe o cliente" readonly>
        </div>

        <button class="btn btn-save w-100">
            <i class="bi bi-floppy"></i>
            Salvar
        </button>
    </div>
</div>
{% endblock %}
