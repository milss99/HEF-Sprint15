<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Hefesto's Stock</title>

    <link rel="stylesheet" href="../static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container-pai_login">
        <div class="container-login">
            <div class="card-login shadow-lg">

                <!-- Logo -->
                <div class="esquerda-login">
                    <img src="../static/images/logo_hefesto's_stock.png" alt="logo">
                </div>

                <!-- Formulário -->
                <div class="direita-login">
                    <div class="titulo-login">
                        <h2>Login</h2>
                        <span>Acesse sua conta</span>
                    </div>

                    <!-- EXIBIR MENSAGENS DE ERRO/SUCESSO DO FLASK (flash) -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} mt-2 mb-2" role="alert">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <!-- ENVOLVER OS CAMPOS NUM FORM COM METHOD POST -->
                    <form action="/login" method="POST" class="campos-login">

                        <!-- E-mail -->
                        <div class="campo">
                            <label for="emailCliente">E-mail</label>
                            <div class="input-wrapper">
                                <i class="bi bi-person-fill"></i>
                                <!-- O name="email_funcionario" deve ser igual ao que o Flask busca -->
                                <input type="email" id="emailCliente" name="email_funcionario" placeholder="Digite seu e-mail" required>
                            </div>
                        </div>

                        <!-- Senha -->
                        <div class="campo">
                            <label for="senhaCliente">Senha</label>
                            <div class="input-wrapper">
                                <i class="bi bi-lock-fill"></i>
                                <!-- O name="senha_funcionario" deve ser igual ao que o Flask busca -->
                                <input type="password" id="senhaCliente" name="senha_funcionario" placeholder="Digite sua senha" required>
                            </div>
                        </div>

                        <!-- Botão de submit normal do formulário -->
                        <button type="submit" class="btn btn-login">
                            Entrar
                        </button>

                        <a href="{{ url_for('login') }}" class="esqueci_senha">Esqueci minha senha</a>

                    </form>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
