{% extends 'base.html' %}
{% block conteudo %}

<link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<main 
    class="consulta-card_consulta_modelo"
    id="consulta-card_consulta_modelo"
>


    <!-- =========================================
         ÁREA DE BUSCA
    ========================================= -->

    <div 
        class="consulta-busca_consulta_modelo"
        id="consulta-busca_consulta_modelo"
    >

        <!-- ÍCONE -->

        <div 
            class="consulta-icone-busca_consulta_modelo"
            id="consulta-icone-busca_consulta_modelo"
        >

            <i class="bi bi-search"></i>

        </div>


        <!-- LABEL -->

        <label 
            class="consulta-label_consulta_modelo"
            id="consulta-label_consulta_modelo"
            for="codigo-modelo_consulta_modelo"
        >

            CÓDIGO DO MODELO:

        </label>


        <!-- INPUT -->

        <div 
            class="consulta-input-container_consulta_modelo"
            id="consulta-input-container_consulta_modelo"
        >

            <input
                type="text"
                class="consulta-input_consulta_modelo"
                id="codigo-modelo_consulta_modelo"
                placeholder="Insira o número do pedido"
            >


            <button
                type="button"
                class="consulta-botao-busca_consulta_modelo"
                id="consulta-botao-busca_consulta_modelo"
            >

                <i class="bi bi-search"></i>

            </button>

        </div>

    </div>



    <!-- =========================================
         TABELA PRINCIPAL
    ========================================= -->

    <div 
        class="consulta-tabela-container_consulta_modelo"
        id="consulta-tabela-container_consulta_modelo"
    >

        <table
            class="consulta-tabela_consulta_modelo"
            id="consulta-tabela_consulta_modelo"
        >


            <!-- CABEÇALHO -->

            <thead>

                <tr>

                    <th>
                        Modelo
                    </th>

                    <th>
                        Código
                    </th>

                    <th>
                        Mínimo para pedido
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Ficha técnica
                    </th>

                </tr>

            </thead>



            <!-- CORPO -->

            <tbody>


                <!-- =========================================
                     MODELO 1
                ========================================= -->

                <tr>

                    <td>
                        1
                    </td>

                    <td>
                        Mouse
                    </td>

                    <td>
                        15
                    </td>


                    <!-- STATUS -->

                    <td>

                        <div 
                            class="consulta-status_consulta_modelo"
                            id="status-1_consulta_modelo"
                        >

                            <label 
                                class="consulta-switch_consulta_modelo"
                                id="switch-1_consulta_modelo"
                            >

                                <input 
                                    type="checkbox"
                                    id="ativo-1_consulta_modelo"
                                >

                                <span 
                                    class="consulta-slider_consulta_modelo"
                                ></span>

                            </label>

                            <span>
                                Inativo/Ativo
                            </span>

                        </div>

                    </td>


                    <!-- FICHA TÉCNICA -->

                    <td>

                        <input
                            type="checkbox"
                            id="ficha-1_modal_consulta_modelo"
                            class="consulta-modal-checkbox_consulta_modelo"
                        >


                        <label
                            for="ficha-1_modal_consulta_modelo"
                            class="consulta-ficha-botao_consulta_modelo"
                            id="ficha-1_consulta_modelo"
                        >

                            Ver ficha

                        </label>

                    </td>

                </tr>



                <!-- =========================================
                     MODELO 2
                ========================================= -->

                <tr>

                    <td>
                        2
                    </td>

                    <td>
                        Teclado
                    </td>

                    <td>
                        20
                    </td>


                    <!-- STATUS -->

                    <td>

                        <div 
                            class="consulta-status_consulta_modelo"
                            id="status-2_consulta_modelo"
                        >

                            <label 
                                class="consulta-switch_consulta_modelo"
                                id="switch-2_consulta_modelo"
                            >

                                <input 
                                    type="checkbox"
                                    id="ativo-2_consulta_modelo"
                                >

                                <span 
                                    class="consulta-slider_consulta_modelo"
                                ></span>

                            </label>

                            <span>
                                Inativo/Ativo
                            </span>

                        </div>

                    </td>


                    <!-- FICHA TÉCNICA -->

                    <td>

                        <input
                            type="checkbox"
                            id="ficha-2_modal_consulta_modelo"
                            class="consulta-modal-checkbox_consulta_modelo"
                        >


                        <label
                            for="ficha-2_modal_consulta_modelo"
                            class="consulta-ficha-botao_consulta_modelo"
                            id="ficha-2_consulta_modelo"
                        >

                            Ver ficha

                        </label>

                    </td>

                </tr>



                <!-- =========================================
                     MODELO 3
                ========================================= -->

                <tr>

                    <td>
                        3
                    </td>

                    <td>
                        Fone
                    </td>

                    <td>
                        25
                    </td>


                    <!-- STATUS -->

                    <td>

                        <div 
                            class="consulta-status_consulta_modelo"
                            id="status-3_consulta_modelo"
                        >

                            <label 
                                class="consulta-switch_consulta_modelo"
                                id="switch-3_consulta_modelo"
                            >

                                <input 
                                    type="checkbox"
                                    id="ativo-3_consulta_modelo"
                                >

                                <span 
                                    class="consulta-slider_consulta_modelo"
                                ></span>

                            </label>

                            <span>
                                Inativo/Ativo
                            </span>

                        </div>

                    </td>


                    <!-- FICHA TÉCNICA -->

                    <td>

                        <input
                            type="checkbox"
                            id="ficha-3_modal_consulta_modelo"
                            class="consulta-modal-checkbox_consulta_modelo"
                        >


                        <label
                            for="ficha-3_modal_consulta_modelo"
                            class="consulta-ficha-botao_consulta_modelo"
                            id="ficha-3_consulta_modelo"
                        >

                            Ver ficha

                        </label>

                    </td>

                </tr>


            </tbody>

        </table>

    </div>


</main>

{% endblock %}
